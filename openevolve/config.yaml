max_iterations: 100
checkpoint_interval: 20

evaluator:
  timeout: 1200

llm:
  models:
    - name: "claude-haiku-4-5-20251001-v1:0"
      weight: 0.7
    - name: "claude-sonnet-4-20250514-v1:0"
      weight: 0.3
  evaluator_models:
    - name: "claude-haiku-4-5-20251001-v1:0"
      weight: 1.0
  api_base: "https://ai-gateway.andrew.cmu.edu"
  temperature: 0.9

database:
  population_size: 100
  archive_size: 50
  num_islands: 4
  migration_interval: 25
  exploration_ratio: 0.35
  exploitation_ratio: 0.55
  feature_dimensions: ["score", "complexity"]
  feature_bins: 6

prompt:
  num_top_programs: 4
  num_diverse_programs: 3
  system_message: |
    You are an expert systems programmer specializing in LLM inference serving systems.
    You are currently using a new type of GPU with both high-bandwidth memory (HBM)
    and high-bandwidth flash (HBF). The total amount of HBM memory (npu_mem) is 24GB while
    the total amount of HBF memory is 80GB. You are optimizing a single function,
    `_device_allocate_policy`, which decides — for every newly stored KV-cache block in
    a batch — whether it lands on NPU HBM or HBF.

    The function is called once per `apply_kv_cache_events` pass with a list of
    `BlockStored` events and the current free-byte totals on each device (already
    reflecting any `BlockRemoved` events from the same pass). It must return one
    `Device` decision per event, in order. Per-event `kv_bytes` is not passed in —
    compute it as `self.get_kv(len(ev.token_ids))`. If you want per-event free
    accounting, deduct from the local `npu_free_bytes` / `hbf_free_bytes` as you
    place each block.

    =========================================================================
    SCORING — read this first
    =========================================================================
    You are scored ONLY on steady-state `hbf_write_rate_MBps`:
        score = -hbf_write_rate_MBps
              = -(MB placed on HBF during steady state) / (steady-state seconds)
    The objective is to maximize this score (i.e., drive HBF write rate toward 0).
    Steady-state refers to the period where the first and last 10% of requests are
    cut off.

    =========================================================================
    Hard constraints (violating these crashes the simulator)
    =========================================================================
    - Return a `list[Device]` with exactly one entry per event, in the same
      order as `events`. Each entry must be exactly `Device.NPU` or
      `Device.HBF`. Any other value, or a length mismatch, raises.
    - For each event's `kv_bytes = self.get_kv(len(ev.token_ids))`:
      if you choose Device.NPU, `kv_bytes` MUST be <= the remaining
      `npu_free_bytes` after earlier placements in this same batch;
      if you choose Device.HBF, `kv_bytes` MUST be <= the remaining
      `hbf_free_bytes` after earlier placements in this same batch.
    - The scheduler normally ensures at least one side has room, but your
      policy must still handle "preferred device full -> fall back" safely,
      including across multiple events within a single call.
    - Do NOT change the function signature, the import, or the
      `# EVOLVE-BLOCK-START` / `# EVOLVE-BLOCK-END` markers.
    - Do NOT add module-level state, global mutation, I/O, or new imports.
      The policy runs on every batch of blocks for every request - keep it
      cheap and deterministic from the passed signals.
    - Read self.* freely (e.g. self.hbf_write_bytes, self.npu_used). Do NOT
      mutate self: the policy must be a pure function of its inputs. Stashing
      state on self will not persist reliably across calls or instances.
